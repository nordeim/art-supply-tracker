name: verify-gate

# The push gate (docs/how-to-git-push-using-ssh-wrapper_SKILL.md): every
# push to main must keep lint, types, tests, and the production build green.
# Prisma's client is generated explicitly (no postinstall hook exists) and
# DATABASE_URL points at a throwaway SQLite file — `next build` evaluates
# the page module but the force-dynamic route performs no queries.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:/tmp/verify-gate.db
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit + action tests
        run: bun run test

      - name: Production build
        run: bun run build
